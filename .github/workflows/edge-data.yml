# EDGE data jobs. Runs the scripts Grok used to run, for free, on GitHub's servers.
# No AI here: pull.py, stats, the model and injury scripts, kalshi.py and grade.py are plain Python.
# Writes go to branch `data` only. Netlify is never touched.
name: EDGE data
run-name: "EDGE data${{ inputs.fast && ' (fast)' || '' }}"

on:
  schedule:
    # Times are UTC. CT = UTC-5 during daylight time.
    - cron: "7 11 * * *"           # ~6am CT  full run: prices, stats, model reads, grade
    - cron: "7 15,19,23 * * *"     # ~10am, 2pm, 6pm CT  prices + closes + grade
    - cron: "37 1,17,21 * * *"   # ~12:30pm, 4:30pm, 8:30pm CT  near-game prices only (sharp scan). Was hourly until
                                 # 2026-10-19: fast runs already price every game in its last 3 hours, and hourly
                                 # near runs were ~45% of Odds API credit use.
  workflow_dispatch:
    inputs:
      full:
        description: "Run stats and model too"
        type: boolean
        default: false
      near:
        description: "Near-game prices only (ignored if full)"
        type: boolean
        default: false
      fast:
        description: "Fast run: games in the next 3 hours only (started by the Netlify clock every 15 minutes)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: edge-data-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: data

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: "Python packages, pinned (the learned models are saved with these versions)"
        run: pip install -q numpy==2.5.3 scikit-learn==1.9.1 cryptography

      - name: Pull prices, closes and scores
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ inputs.fast }}" = "true" ]; then
            EDGE_FAST=1 python pull.py pull --near 3
          elif [ "${{ github.event.schedule }}" = "37 1,17,21 * * *" ] || { [ "${{ inputs.near }}" = "true" ] && [ "${{ inputs.full }}" != "true" ]; }; then
            # The Netlify clock is deployed by upload and may still send hourly near runs; only the
            # 1, 17 and 21 UTC slots spend credits (2026-10-19). For an off-slot price check, dispatch full or fast.
            h=$(date -u +%-H)
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$h" != "1" ] && [ "$h" != "17" ] && [ "$h" != "21" ]; then
              echo '{"near": 12, "skipped": "outside the 1, 17, 21 UTC near slots"}'
            else
              python pull.py pull --near 12
            fi
          else
            python pull.py
          fi

      - name: Stats and model reads (morning run only)
        if: github.event.schedule == '7 11 * * *' || inputs.full
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python stats.py || echo "::warning::stats.py failed; continuing"
          python stats_more.py || echo "::warning::stats_more.py failed; continuing"
          python cfbd.py || echo "::warning::cfbd.py failed; continuing"
          python model.py || echo "::warning::model.py failed; continuing"
          python model_nba.py || echo "::warning::model_nba.py failed; continuing"
          python model_ncaaf.py || echo "::warning::model_ncaaf.py failed; continuing"
          python soccer_form.py || echo "::warning::soccer_form.py failed; continuing"
          python features_nhl.py refresh || echo "::warning::features_nhl.py refresh failed; continuing"
          python features_ncaaf.py refresh || echo "::warning::features_ncaaf.py refresh failed; continuing"
          python discover.py || echo "::warning::discover.py failed; continuing"

      - name: Sharp vs soft scan
        run: python sharp.py || echo "::warning::sharp.py failed; continuing"

      - name: Weather and wind-total reads
        if: ${{ !inputs.fast }}
        run: python wind.py || echo "::warning::wind.py failed; continuing"

      - name: Injury, rest and goalie news reads
        run: |
          python injury.py || echo "::warning::injury.py failed; continuing"
          python injury_nba.py || echo "::warning::injury_nba.py failed; continuing"
          python rest_nba.py || echo "::warning::rest_nba.py failed; continuing"
          python goalie_nhl.py || echo "::warning::goalie_nhl.py failed; continuing"

      - name: Line-move and situational reads (NHL moves, college spots)
        if: ${{ !inputs.fast }}
        run: |
          python move_nhl.py || echo "::warning::move_nhl.py failed; continuing"
          python ncaaf_spots.py || echo "::warning::ncaaf_spots.py failed; continuing"

      - name: Tennis, learned models, then the edge stack
        run: |
          python tennis.py || echo "::warning::tennis.py failed; continuing"
          python learn_live.py || echo "::warning::learn_live.py failed; continuing"
          python edge_stack.py || echo "::warning::edge_stack.py failed; continuing"

      - name: CS2 ratings (PandaScore)
        if: ${{ !inputs.fast }}
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        run: python cs2.py || echo "::warning::cs2.py failed; continuing"

      - name: Grade
        run: python grade.py

      - name: Kalshi pricing and trades (paper always; real orders only when the app's switch is on)
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_DEMO_KEY_ID: ${{ secrets.KALSHI_DEMO_KEY_ID }}
          KALSHI_DEMO_PRIVATE_KEY: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY }}
        run: |
          python kalshi.py || echo "::warning::kalshi.py failed; continuing"

      - name: Archive finished games and check every sport's loop
        run: |
          if [ "${{ inputs.fast }}" != "true" ]; then python archive.py || echo "::warning::archive.py failed; continuing"; fi
          python loop_check.py || echo "::warning::loop_check.py failed; continuing"

      - name: Phone alerts (ntfy)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify.py || echo "::warning::notify.py failed; continuing"

      - name: Push to branch data
        run: |
          git config user.name "EDGE"
          git config user.email "edge@edgesystem.local"
          git add -A
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -q -m "EDGE: ${{ inputs.fast && 'fast run' || 'pull.py and grade.py update' }}"
          for i in 1 2 3; do
            git pull -q --rebase origin data && git push -q origin HEAD:data && exit 0
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              echo "::warning::Rebase conflict on: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              git rebase --abort
            fi
            echo "Push raced another writer, retrying ($i)"; sleep 15
          done
          echo "::error::Could not push after 3 tries"; exit 1
