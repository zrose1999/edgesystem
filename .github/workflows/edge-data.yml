# EDGE data jobs. Runs the scripts Grok used to run, for free, on GitHub's servers.
# No AI here: pull.py, stats, the model and injury scripts, kalshi.py and grade.py are plain Python.
# Writes go to branch `data` only. Netlify is never touched.
name: EDGE data

on:
  schedule:
    # Times are UTC. CT = UTC-5 during daylight time.
    - cron: "7 11 * * *"           # ~6am CT  full run: prices, stats, model reads, grade
    - cron: "7 15,19,23 * * *"     # ~10am, 2pm, 6pm CT  prices + closes + grade
    - cron: "37 0-3,16-18,20-22 * * *"   # hourly ~11:30am-10:30pm CT  near-game prices only (sharp scan)
  workflow_dispatch:
    inputs:
      full:
        description: "Run stats and model too"
        type: boolean
        default: false
      near:
        description: "Near-game prices only (ignored if full)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: edge-data-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: data

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pull prices, closes and scores
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "37 0-3,16-18,20-22 * * *" ] || { [ "${{ inputs.near }}" = "true" ] && [ "${{ inputs.full }}" != "true" ]; }; then
            python pull.py pull --near 12
          else
            python pull.py
          fi

      - name: Stats and model reads (morning run only)
        if: github.event.schedule == '7 11 * * *' || inputs.full
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python stats.py || echo "::warning::stats.py failed; continuing"
          python stats_more.py || echo "::warning::stats_more.py failed; continuing"
          python cfbd.py || echo "::warning::cfbd.py failed; continuing"
          python model.py || echo "::warning::model.py failed; continuing"
          python model_nba.py || echo "::warning::model_nba.py failed; continuing"

      - name: Sharp vs soft scan
        run: python sharp.py || echo "::warning::sharp.py failed; continuing"

      - name: Weather and wind-total reads
        run: python wind.py || echo "::warning::wind.py failed; continuing"

      - name: Injury, rest and goalie news reads
        run: |
          python injury.py || echo "::warning::injury.py failed; continuing"
          python injury_nba.py || echo "::warning::injury_nba.py failed; continuing"
          python rest_nba.py || echo "::warning::rest_nba.py failed; continuing"
          python goalie_nhl.py || echo "::warning::goalie_nhl.py failed; continuing"

      - name: CS2 ratings (PandaScore)
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        run: python cs2.py || echo "::warning::cs2.py failed; continuing"

      - name: Grade
        run: python grade.py

      - name: Kalshi pricing and trades (paper always; real orders only when the app's switch is on)
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_DEMO_KEY_ID: ${{ secrets.KALSHI_DEMO_KEY_ID }}
          KALSHI_DEMO_PRIVATE_KEY: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY }}
        run: |
          pip install -q cryptography
          python kalshi.py || echo "::warning::kalshi.py failed; continuing"

      - name: Push to branch data
        run: |
          git config user.name "EDGE"
          git config user.email "edge@edgesystem.local"
          git add -A
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -q -m "EDGE: pull.py and grade.py update"
          for i in 1 2 3; do
            git pull -q --rebase origin data && git push -q origin HEAD:data && exit 0
            echo "Push raced another writer, retrying ($i)"; sleep 15
          done
          echo "::error::Could not push after 3 tries"; exit 1
