# Kalshi order-path self-test on the DEMO exchange (mock funds). Run by hand; never touches production.
name: Kalshi self-test (demo)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: data
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -q cryptography
      - name: Self-test on demo
        env:
          KALSHI_DEMO_KEY_ID: ${{ secrets.KALSHI_DEMO_KEY_ID }}
          KALSHI_DEMO_PRIVATE_KEY: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY }}
        run: python kalshi_selftest.py
