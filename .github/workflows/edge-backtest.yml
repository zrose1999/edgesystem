# EDGE backtest. Rechecks the sizing.md values against nflverse history.
# Runs on demand and once a month; writes stats/backtest_nfl*.md and stats/backtest_nba_rest.md on branch data. No AI, no API key.
name: EDGE backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 1 * *"   # 1st of each month, ~5am CT

permissions:
  contents: write

concurrency:
  group: edge-data-writer
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: data
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -q numpy==2.5.3 scikit-learn==1.9.1
      - run: python backtest.py
      - run: python rest_nba.py --backtest
      - run: python cs2.py --backtest || true
      - run: python tennis.py --backtest || true
      - run: python discover.py || true
      - name: Retrain the learned models (rebuilt feature stores, walk-forward gate)
        run: |
          python features_nhl.py refresh || true
          python features_nhl.py history
          python features_soccer.py history
          python features_nba.py history
          python features_archive.py
          python learner.py all
          python learner.py live || true
      - name: Push to branch data
        run: |
          git config user.name "EDGE"
          git config user.email "edge@edgesystem.local"
          git add stats/backtest_nfl*.json stats/backtest_nfl*.md stats/backtest_nba*.json stats/backtest_nba*.md stats/backtest_cs2.md stats/backtest_tennis.md stats/discovery.md stats/discovery.json stats/models stats/features/nhl_team_games.json stats/features/nhl_goalie_seasons.json stats/features/nhl_starters.json stats/features/archive_targets.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -q -m "EDGE: backtest refresh"
          for i in 1 2 3; do
            git pull -q --rebase origin data && git push -q origin HEAD:data && exit 0
            echo "Push raced another writer, retrying ($i)"; sleep 15
          done
          exit 1
