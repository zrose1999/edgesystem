<title>EDGE Matchup Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a scouting sheet. Game strip on top, then one game at a time: tape (unit vs unit), notes, trends, personnel. */
:root {
  --bg: #f4f6f2; --panel: #ffffff; --ink: #18211b; --muted: #5d6b62; --line: #d9e0d9;
  --turf: #1d6b45; --off: #1d7a4c; --off-soft: #e1f1e7; --def: #b23a2c; --def-soft: #f8e4e0;
  --flag: #a86a00; --flag-soft: #fcf0d6; --track: #e8ede8;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1511; --panel: #161e19; --ink: #e6ece7; --muted: #93a39a; --line: #29342d;
  --turf: #5cc48d; --off: #5cc48d; --off-soft: #173325; --def: #f08a7c; --def-soft: #3a1d19;
  --flag: #f0b84a; --flag-soft: #33280f; --track: #222c26; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1511; --panel: #161e19; --ink: #e6ece7; --muted: #93a39a; --line: #29342d;
  --turf: #5cc48d; --off: #5cc48d; --off-soft: #173325; --def: #f08a7c; --def-soft: #3a1d19;
  --flag: #f0b84a; --flag-soft: #33280f; --track: #222c26; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; }
header { display: grid; gap: 6px; }
.eyebrow { font: 600 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 40px/1 var(--display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
h2 { font: 600 24px/1.1 var(--display); letter-spacing: .02em; margin: 0; text-transform: uppercase; }
.badge { display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 3px;
  background: var(--flag-soft); color: var(--flag); font: 600 12px/1.3 var(--body); width: fit-content; }
.sub { color: var(--muted); max-width: 70ch; margin: 0; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.chip { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 4px;
  padding: 8px 12px; text-align: left; cursor: pointer; font: inherit; display: grid; gap: 2px; min-width: 132px; }
.chip b { font: 600 18px/1 var(--display); letter-spacing: .03em; }
.chip span { font: 12px/1.2 var(--mono); color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--turf); box-shadow: inset 0 -3px 0 var(--turf); }
.chip:focus-visible, button:focus-visible { outline: 2px solid var(--turf); outline-offset: 2px; }
.n { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--off-soft); color: var(--off);
  font: 600 11px/18px var(--mono); text-align: center; }
.game { display: grid; gap: 22px; }
.score { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.team { display: grid; gap: 2px; min-width: 0; }
.team.home { text-align: right; }
.team .ab { font: 700 56px/0.9 var(--display); }
.team .nm { color: var(--muted); font-size: 13px; }
.team .qb { font: 500 13px/1.3 var(--mono); }
.at { font: 600 22px/1 var(--display); color: var(--muted); padding-bottom: 10px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font: 13px/1.4 var(--mono); color: var(--muted); }
.facts b { color: var(--ink); font-weight: 500; }
.warn { border-left: 3px solid var(--flag); background: var(--flag-soft); padding: 10px 14px; border-radius: 0 4px 4px 0; display: grid; gap: 4px; }
.sec { display: grid; gap: 12px; }
.sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sechead p { margin: 0; color: var(--muted); font-size: 13px; }
.tape { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.side h3 { margin: 0; font: 600 17px/1.2 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.row { display: grid; grid-template-columns: 9.5em 1fr 4.6em; gap: 10px; align-items: center; font-size: 13px; }
.row .lab { color: var(--muted); }
.row .tag { font: 600 11px/1 var(--body); text-align: right; letter-spacing: .04em; text-transform: uppercase; }
.row .tag.o { color: var(--off); } .row .tag.d { color: var(--def); } .row .tag.s { color: var(--muted); }
.trk { position: relative; height: 22px; background: var(--track); border-radius: 2px; }
.trk .gap { position: absolute; top: 9px; height: 4px; border-radius: 2px; }
.dot { position: absolute; top: 2px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%;
  font: 600 9px/18px var(--mono); text-align: center; color: var(--panel); }
.dot.o { background: var(--off); } .dot.d { background: var(--def); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.note { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.note .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.note .lbl { font: 600 20px/1.1 var(--display); letter-spacing: .02em; }
.note .mk { font: 600 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.note ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; }
.conf { font: 600 11px/1 var(--body); text-transform: uppercase; letter-spacing: .06em; }
.conf.medium { color: var(--off); } .conf.low { color: var(--muted); }
.mem { font: 12px/1.4 var(--mono); color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.props { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.prop { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.prop .who { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.prop .nm { font: 600 19px/1.1 var(--display); letter-spacing: .02em; }
.prop .pos { font: 500 12px/1 var(--mono); color: var(--muted); white-space: nowrap; }
.prop .stat { font-weight: 600; }
.pill { display: inline-block; font: 600 11px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; }
.pill.over { background: var(--off-soft); color: var(--off); } .pill.under { background: var(--def-soft); color: var(--def); }
.nums { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 12.5px/1.4 var(--mono); color: var(--muted); }
.nums b { color: var(--ink); font-weight: 500; }
.prop ul { margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--muted); display: grid; gap: 2px; }
.top { display: grid; gap: 10px; }
.toplist { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.toplist button { flex: none; width: 230px; text-align: left; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; }
.toplist button:hover { border-color: var(--turf); }
.record { font: 13px/1.4 var(--mono); color: var(--muted); }
.empty { color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 4px; padding: 14px; margin: 0; }
.tbl { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { font: 600 11px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
th:first-child, td:first-child { text-align: left; }
tr:last-child td { border-bottom: 0; }
td.st { color: var(--def); font-weight: 600; } td.q { color: var(--flag); font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.two > div { min-width: 0; display: grid; gap: 8px; }
.two h3 { margin: 0; font: 600 17px/1.2 var(--display); letter-spacing: .04em; text-transform: uppercase; }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; }
summary { cursor: pointer; font-weight: 600; }
details ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; display: grid; gap: 3px; }
footer { color: var(--muted); font-size: 12.5px; max-width: 80ch; }
@media (max-width: 760px) {
  .tape, .two { grid-template-columns: 1fr; }
  .team .ab { font-size: 42px; }
  .row { grid-template-columns: 7.6em 1fr 4.2em; }
  h1 { font-size: 32px; }
}
.back { display: none; justify-self: start; align-items: center; gap: 6px; font: 600 16px/1 var(--display); letter-spacing: .05em;
  text-transform: uppercase; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  padding: 10px 14px; min-height: 44px; cursor: pointer; }
/* Phones: the games are a list; tapping one opens it full width with "All games" above and below it (2026-10-22). */
@media (max-width: 760px) {
  .strip { display: grid; grid-template-columns: 1fr; overflow: visible; }
  .chip { min-width: 0; padding: 12px 14px; }
  body.picked .strip, body.picked .top, body.picked header { display: none; }
  body:not(.picked) .game { display: none; }
  body.picked .back { display: inline-flex; }
}
@media (prefers-reduced-motion: no-preference) { .dot { transition: left .25s ease; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="hdr-eyebrow">EDGE secondary desk</div>
    <h1>Matchup Notes</h1>
    <div class="badge">Information only. Not official EDGE plays: no stake, no reads, never traded.</div>
    <p class="sub" id="hdr-sub"></p>
  </header>
  <section class="top" id="top" hidden>
    <div class="sechead"><h2>Best prop matchups this week</h2><p>Player usage against what the defense allows to his position. Tap one to open the game.</p></div>
    <div class="toplist" id="toplist"></div>
  </section>
  <nav class="strip" id="strip" aria-label="Games"></nav>
  <button type="button" class="back" id="backTop">&larr; All games</button>
  <main class="game" id="game"></main>
  <button type="button" class="back" id="backBottom">&larr; All games</button>
  <footer id="foot"></footer>
</div>

<script>
const DATA = /*__DATA__*/null;
const UNIT_LABEL = { epa: "EPA per play", pass_epa: "EPA per dropback", rush_epa: "EPA per rush", success: "Success rate",
  explosive: "Explosive rate", ppd: "Points per drive", rz_td: "Red-zone TD rate", third: "3rd-down conv.", sack: "Sack rate",
  pressure: "Pressure rate", giveaway: "Turnovers / drive", deep_epa: "Deep-throw EPA" };
const PCT = new Set(["success","explosive","rz_td","third","sack","pressure"]);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fv = (k, v) => v == null ? "–" : PCT.has(k) ? (v*100).toFixed(0)+"%" : (k==="ppd"||k==="giveaway") ? v.toFixed(2) : (v>=0?"+":"")+v.toFixed(2);
const sl = v => v == null ? "–" : (v > 0 ? "+" : "") + v;
const rec = r => r ? `${r.w}-${r.l}${r.p ? "-"+r.p : ""}` : "–";
const kick = s => { const d = new Date(s + ":00"); return d.toLocaleDateString(undefined,{weekday:"short",month:"numeric",day:"numeric"}) + " " + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}) + " ET"; };

function chip(g) {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.id = "chip-" + g.id;
  const sp = g.lines.spread?.line ?? g.nflverseLine.homeSpread;
  const n = g.suggestions.length + (g.props || []).length;
  b.innerHTML = `<b>${g.away} @ ${g.home} ${n ? `<span class="n">${n}</span>` : ""}</b><span>${kick(g.kickoffET)}</span><span>${g.home} ${sl(sp)} · ${g.lines.total?.line ?? g.nflverseLine.total}</span>`;
  b.onclick = () => open_(g.id);
  return b;
}

function track(m) {
  const pos = r => ((r - 1) / 31) * 100;
  const a = pos(m.offRank), b = pos(m.defRank);
  const lo = Math.min(a, b), hi = Math.max(a, b);
  const col = m.kind === "offense edge" ? "var(--off)" : m.kind === "defense edge" ? "var(--def)" : "var(--line)";
  return `<div class="trk" title="${esc(m.offense)} offense #${m.offRank} · ${esc(m.defense)} defense #${m.defRank}">
    <div class="gap" style="left:${lo}%;width:${hi-lo}%;background:${col}"></div>
    <div class="dot o" style="left:${a}%">${m.offRank}</div><div class="dot d" style="left:${b}%">${m.defRank}</div></div>`;
}

function tapeSide(g, off, def) {
  const rows = g.mismatches[off].map(m => {
    const tag = m.kind === "offense edge" ? `<span class="tag o">${m.strong ? "Big " : ""}edge</span>`
      : m.kind === "defense edge" ? `<span class="tag d">${m.strong ? "Big " : ""}wall</span>`
      : m.kind ? `<span class="tag s">Str v str</span>` : `<span class="tag s"></span>`;
    return `<div class="row"><span class="lab">${esc(m.unit)}</span>${track(m)}${tag}</div>`;
  }).join("");
  return `<div class="side"><h3>${off} offense vs ${def} defense</h3>${rows}</div>`;
}

function noteCard(s) {
  const mk = s.market === "team total" ? "Team total" : s.market;
  const m = s.memory || {};
  let mem = "No close past situations in EDGE's living memory.";
  if (s.market !== "player" && m.sameSide && m.sameSide.n) {
    mem = `EDGE memory, closest past reads (NFL ${s.market === "spread" ? "spread" : "total"}, same side type): n ${m.sameSide.n}, mean CLV ${(m.sameSide.meanClv*100).toFixed(1)}%.`;
  } else if (s.market === "player") {
    mem = "No player-prop history in EDGE's memory yet; prop lines are not pulled (credits).";
  }
  return `<article class="note"><div class="top"><span class="lbl">${esc(s.label)}</span><span class="mk">${esc(mk)}</span></div>
    <span class="conf ${s.confidence}">${s.confidence} confidence${s.lineAtNote != null ? " · line when noted " + s.lineAtNote : ""}</span>
    <ul>${s.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul><div class="mem">${esc(mem)}</div></article>`;
}

const STAT_UNIT = { rec_yds: "yds", receptions: "rec", rush_yds: "yds", pass_yds: "yds", td: "" };
function propNums(x) {
  if (x.stat === "td") return `<span>Chance to score <b>${Math.round(x.projection*100)}%</b></span><span>Season ${x.seasonAvg.toFixed(2)} TD/g</span>`;
  if (x.projection == null) return x.seasonAvg != null ? `<span>Season <b>${x.seasonAvg}</b></span>` : "";
  const d = x.stat === "receptions" ? 1 : 0;
  return `<span>Matchup <b>${x.projection.toFixed(d)}</b> ${STAT_UNIT[x.stat]||""}</span><span>Season ${x.seasonAvg.toFixed(d)}</span>${x.last3Avg != null ? `<span>Last 3 ${x.last3Avg.toFixed(d)}</span>` : ""}`;
}
function propCard(x) {
  return `<article class="prop"><div class="who"><span class="nm">${esc(x.player)}</span><span class="pos">${esc(x.pos)} · ${esc(x.team)} vs ${esc(x.opp)}</span></div>
    <div><span class="stat">${esc(x.label)}</span> <span class="pill ${x.side}">${x.side}${x.strength === "strong" ? " · strong" : ""}</span>${x.status && x.status !== "Active" ? ` <span class="pill under">${esc(x.status)}</span>` : ""}</div>
    <div class="nums">${propNums(x)}</div>
    <ul>${x.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul></article>`;
}
function propSection(g) {
  const ov = g.props.filter(x => x.side === "over"), un = g.props.filter(x => x.side === "under");
  if (!g.props.length) return `<p class="empty">No player clears the prop bar here: usage of 4+ targets, 8+ carries or a starting QB, against a defense in the top or bottom 8 at what it allows to his position.</p>`;
  return (ov.length ? `<div class="sechead"><p><b>Over angles</b> · the defense gives his position more than most</p></div><div class="props">${ov.map(propCard).join("")}</div>` : "")
    + (un.length ? `<div class="sechead"><p><b>Under angles</b> · the defense takes his position away</p></div><div class="props">${un.map(propCard).join("")}</div>` : "");
}

function unitTable(g) {
  const keys = Object.keys(UNIT_LABEL);
  const teams = [g.away, g.home];
  const cell = (t, side, k) => { const u = g.units[t][side][k]; return `${fv(k,u.value)} <span style="color:var(--muted)">#${u.rank ?? "–"}</span>`; };
  const l3 = (t, side, k) => { const u = g.units[t][side][k]; return `${fv(k,u.last3)}`; };
  return `<div class="tbl"><table><thead><tr><th>Unit</th>${teams.map(t=>`<th>${t} off</th><th>last 3</th><th>${t} def</th><th>last 3</th>`).join("")}</tr></thead><tbody>
    ${keys.map(k => `<tr><td>${UNIT_LABEL[k]}</td>${teams.map(t => `<td>${cell(t,"off",k)}</td><td>${l3(t,"off",k)}</td><td>${cell(t,"def",k)}</td><td>${l3(t,"def",k)}</td>`).join("")}</tr>`).join("")}
  </tbody></table></div>`;
}

function trendTable(g) {
  const T = g.trends, teams = [g.away, g.home];
  const rows = [["ATS this season","atsSeason"],["O/U this season","ouSeason"],["ATS last 10","atsLast10"],["O/U last 10","ouLast10"],
    ["Prime time ATS (since last season)","atsPrime"],["Prime time O/U","ouPrime"]];
  return `<div class="tbl"><table><thead><tr><th>Trend (vs closing number)</th>${teams.map(t=>`<th>${t}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(([l,k]) => `<tr><td>${l}</td>${teams.map(t=>`<td>${rec(T[t][k])}</td>`).join("")}</tr>`).join("")}
    <tr><td>In tonight's role</td>${teams.map(t=>`<td>${rec(T[t].atsRole)} <span style="color:var(--muted)">${esc(T[t].roleLabel)}</span></td>`).join("")}</tr>
    <tr><td>Straight up, last 5 (oldest first)</td>${teams.map(t=>`<td style="font-family:var(--mono)">${esc(T[t].suLast5)}</td>`).join("")}</tr>
  </tbody></table></div>`;
}

function people(g, t) {
  const P = g.players[t];
  const stc = s => s && s !== "Active" ? `<td class="${s==="Questionable"?"q":"st"}">${esc(s)}</td>` : `<td>${s ? "Active" : ""}</td>`;
  const rec = P.receivers.map(r => `<tr><td>${esc(r.name)}</td><td>${fv("success",r.tgtShare)}</td><td>${r.tgtPg.toFixed(1)}</td><td>${r.ydsPg.toFixed(0)}</td><td>${r.aDOT==null?"–":r.aDOT.toFixed(1)}</td><td>${fv("success",r.airShare)}</td>${stc(r.status)}</tr>`).join("");
  const ru = P.rushers.map(r => `<tr><td>${esc(r.name)}</td><td>${fv("success",r.carryShare)}</td><td>${r.ydsPg.toFixed(0)}</td><td>${r.ypc==null?"–":r.ypc.toFixed(1)}</td>${stc(r.status)}</tr>`).join("");
  const q = P.qb ? `<p class="sub" style="font-size:13px">${esc(P.qb.name)}: ${P.qb.epaPerDropback==null?"no snaps this season":fv("epa",P.qb.epaPerDropback)+" EPA per dropback, CPOE "+(P.qb.cpoe==null?"–":P.qb.cpoe.toFixed(1))+", "+P.qb.dropbacks+" dropbacks ("+Math.round((P.qb.shareOfTeamDropbacks||0)*100)+"% of team)"}</p>` : "";
  return `<div><h3>${t}</h3>${q}
    <div class="tbl"><table><thead><tr><th>Receiver</th><th>Tgt share</th><th>Tgt/g</th><th>Yds/g</th><th>aDOT</th><th>Air share</th><th>Status</th></tr></thead><tbody>${rec}</tbody></table></div>
    <div class="tbl"><table><thead><tr><th>Rusher</th><th>Carry share</th><th>Yds/g</th><th>YPC</th><th>Status</th></tr></thead><tbody>${ru}</tbody></table></div></div>`;
}

function show(id, push) {
  const g = DATA.games.find(x => x.id === id) || DATA.games[0];
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.id === "chip-" + g.id ? "true" : "false"));
  if (push) { try { history.replaceState(null, "", "#" + g.id); } catch (e) {} }
  const sp = g.lines.spread?.line ?? g.nflverseLine.homeSpread, tot = g.lines.total?.line ?? g.nflverseLine.total;
  const P = g.projection;
  const flags = Object.values(g.qbFlags || {});
  document.getElementById("game").innerHTML = `
    <div class="score">
      <div class="team"><span class="ab">${g.away}</span><span class="nm">${esc(g.awayName)}</span><span class="qb">QB ${esc(g.qbs[g.away])}</span></div>
      <span class="at">at</span>
      <div class="team home"><span class="ab">${g.home}</span><span class="nm">${esc(g.homeName)}</span><span class="qb">QB ${esc(g.qbs[g.home])}</span></div>
    </div>
    <div class="facts"><span>${kick(g.kickoffET)}</span><span>Line <b>${g.home} ${sl(sp)}</b></span><span>Total <b>${tot}</b></span>
      <span>Matchup view <b>${g.home} ${sl(-P.margin)} · ${P.total}</b></span><span>Rest ${g.away} ${g.rest[g.away] ?? "–"}d · ${g.home} ${g.rest[g.home] ?? "–"}d</span>
      ${g.roof ? `<span>${esc(g.roof)}${g.surface ? ", "+esc(g.surface) : ""}</span>` : ""}</div>
    ${g.weather ? `<div class="facts"><span>Weather: ${esc(g.weather)}</span></div>` : ""}
    ${flags.length ? `<div class="warn"><b>Starter check</b>${flags.map(f=>`<span>${esc(f)}</span>`).join("")}</div>` : ""}
    <section class="sec"><div class="sechead"><h2>Tale of the tape</h2>
      <div class="legend"><span><i style="background:var(--off)"></i>offense rank</span><span><i style="background:var(--def)"></i>defense rank</span><span>1 = best in the league, 32 = worst</span></div></div>
      <div class="tape">${tapeSide(g, g.away, g.home)}${tapeSide(g, g.home, g.away)}</div></section>
    <section class="sec"><div class="sechead"><h2>Suggestions</h2><p>Leans from the mismatches. Graded on their own record, never mixed with EDGE's CLV desk.</p></div>
      ${g.suggestions.length ? `<div class="notes">${g.suggestions.map(noteCard).join("")}</div>` : `<p class="empty">No suggestion clears the bar for this game. The tape above is the read: no unit mismatch is big enough and the matchup view sits near the market.</p>`}</section>
    <section class="sec"><div class="sechead"><h2>Props</h2><p>Matchup number = his recent production adjusted toward what this defense allows his position (60% of its gap from average, weighted for sample). No book lines are pulled; compare with your book.</p></div>${propSection(g)}</section>
    <section class="sec"><div class="sechead"><h2>Unit stats</h2><p>Season value and league rank, then the last ${g.last3Weeks.length} weeks (${g.last3Weeks.map(w=>"wk "+w).join(", ")}).</p></div>${unitTable(g)}</section>
    <section class="sec"><div class="sechead"><h2>Trends</h2><p>Small samples. Context, not a reason on their own.</p></div>${trendTable(g)}</section>
    <section class="sec"><div class="sechead"><h2>Personnel</h2><p>Season usage. Status from EDGE's injury feed.</p></div><div class="two">${people(g, g.away)}${people(g, g.home)}</div></section>
    ${g.injuries.length ? `<details><summary>Injury report (${g.injuries.length})</summary><ul>${g.injuries.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></details>` : ""}`;
}

const phone = () => matchMedia("(max-width: 760px)").matches;
const toTop = el => { try { el.scrollIntoView({ block: "start" }); } catch (e) {} };
function open_(id) {
  show(id, true);
  if (phone()) {
    document.body.classList.add("picked");
    try { history.pushState({ mx: id }, ""); } catch (e) {}   // the phone's back button returns to the list
  }
  toTop(phone() ? document.querySelector(".wrap") : document.getElementById("game"));
}
function list_() {
  document.body.classList.remove("picked");
  toTop(document.getElementById("strip"));
}
function back_() {
  if (history.state && history.state.mx) { try { history.back(); return; } catch (e) {} }
  list_();
}
window.addEventListener("popstate", () => { if (document.body.classList.contains("picked")) list_(); });

(function init() {
  document.getElementById("backTop").onclick = back_;
  document.getElementById("backBottom").onclick = back_;
  if (!DATA || !DATA.games.length) { document.getElementById("game").innerHTML = `<p class="empty">No NFL games in the window yet.</p>`; return; }
  document.getElementById("hdr-eyebrow").textContent = `EDGE secondary desk · NFL ${DATA.season} · stats through week ${DATA.throughWeek}`;
  document.getElementById("hdr-sub").textContent = `Key stats and unit-vs-unit matchups for ${DATA.games.length} upcoming games, with game suggestions and player prop matchups. Built ${new Date(DATA.generated).toLocaleString()}.`;
  if ((DATA.topProps || []).length) {
    document.getElementById("top").hidden = false;
    document.getElementById("toplist").innerHTML = DATA.topProps.map((x, i) => `<button type="button" data-g="${esc(x.gameId)}" id="tp-${i}">
      <span class="nm" style="font:600 18px/1.1 var(--display)">${esc(x.player)} <span class="pos" style="font:500 12px var(--mono);color:var(--muted)">${esc(x.pos)} · ${esc(x.team)} vs ${esc(x.opp)}</span></span>
      <span>${esc(x.label)} <span class="pill ${x.side}">${x.side}</span></span><span class="nums">${propNums(x)}</span><span class="nums">${esc(x.opp)} #${x.oppRank} vs ${esc(x.pos)}s</span></button>`).join("");
    document.getElementById("toplist").addEventListener("click", e => { const b = e.target.closest("button[data-g]"); if (b) open_(b.dataset.g); });
  }
  const R = DATA.record;
  if (R && (R.suggestions !== "0-0" || R.props !== "0-0")) {
    document.getElementById("hdr-sub").insertAdjacentHTML("afterend", `<p class="record">Notes record so far: suggestions ${esc(R.suggestions)}, props ${esc(R.props)} (strong ${esc(R.propsStrong)}). Props are graded against the matchup number, not a book line.</p>`);
  }
  const strip = document.getElementById("strip");
  DATA.games.forEach(g => strip.appendChild(chip(g)));
  document.getElementById("foot").textContent = "Data: nflverse play-by-play and schedule; lines, injuries and weather from EDGE's own collectors. Matchup view = each offense's points per drive against the other defense's, shrunk toward league average, times expected drives, plus 1.5 for home field. It is a context number, not a model read. Deep-throw EPA rests on small samples (about 20 throws a team).";
  const h = (location.hash || "").slice(1);
  show(DATA.games.some(g => g.id === h) ? h : DATA.games[0].id, false);
})();
</script>
