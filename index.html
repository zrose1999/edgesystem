<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EDGE 06:00 CT — Gumdrop</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 15px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #0c0f0c; color: #d7e0d2; }
    header, main { max-width: 880px; margin: 0 auto; padding: 24px 18px; }
    h1 { font-size: 20px; letter-spacing: 0.08em; margin: 0 0 6px; }
    h2 { font-size: 14px; letter-spacing: 0.06em; color: #8ea08a; }
    .sub { color: #8ea08a; margin-bottom: 18px; }
    .pass { border: 1px solid #3d4a38; padding: 12px 14px; margin: 10px 0; background: #121712; }
    .tag { color: #e2b34b; }
    .kill { color: #e07a7a; }
    .win { color: #8fce7a; }
    footer { color: #6d7c69; font-size: 12px; margin-top: 22px; }
  </style>
</head>
<body>
  <header>
    <h1>EDGE · 06:00 CT · EARLY SWEEP · EU + MLB · RAINMAN</h1>
    <div class="sub">Gumdrop live desk 068c6961-0a3d-4374-87f1-f3d2ce34f293 · official +CLV 0-0 · exposure 0u of 6u · new today 0u</div>
  </header>
  <main id="root">Loading card.json…</main>
  <script>
    fetch('card.json?lock=0600', { cache: 'no-store' }).then(r => r.json()).then(card => {
      const root = document.getElementById('root');
      const settled = (card.settled || []).map(s =>
        `<div class="pass"><div class="tag win">${s.result}</div><strong>${s.name}</strong> · ${s.final}<br>${s.clv || ''}<br>${s.autopsy}</div>`
      ).join('') || '<div class="pass">None on this stamp.</div>';
      const official = (card.official || []).map(s =>
        `<div class="pass"><div class="tag">${s.status} · ${s.stakeU}u</div><strong>${s.name}</strong><br>${s.number}<br>${s.why}</div>`
      ).join('') || '<div class="pass">None. No-action. Hold list is empty.</div>';
      const killed = (card.killed || []).map(s =>
        `<div class="pass"><div class="tag kill">${s.action}</div><strong>${s.id}</strong> · was ${s.was}<br>${s.why}</div>`
      ).join('');
      const shadows = (card.shadow || []).map(s =>
        `<div class="pass"><div class="tag">${(s.tag || '').toUpperCase()}</div><strong>${s.id}</strong> · ${s.market}<br>${s.units || ''}<br>Street ${s.street}<br>${s.why}</div>`
      ).join('');
      root.innerHTML = `<p>${card.decision}</p><p>Rule: ${card.rule}</p><p>Record ${card.records.graded_official_wl}. Official +CLV n=${card.records.settledPlayClvN}. ${card.records.graded_note}</p><h2>Settled</h2>${settled}<h2>Official</h2>${official}<h2>Killed</h2>${killed}<h2>Shadow</h2>${shadows}<footer>Not a wager. Prices are public prints at stamp only. Scratch = kill. therosesystem not touched.</footer>`;
    }).catch(err => {
      document.getElementById('root').textContent = 'card.json failed: ' + err;
    });
  </script>
</body>
</html>
